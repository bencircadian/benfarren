    const DECAY = -0.5;
    const FACTOR = 19 / 81;
    const DEFAULT_W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    function createDeck(params) {
      const w = (params && params.w) || DEFAULT_W;
      const rr = (params && params.requestedRetentionRate) || 0.9;
      const MAX_S = (params && params.maxStability) || 36500;

      const retrievability = (t, S) => Math.pow(1 + FACTOR * (t / S), DECAY);
      const nextInterval = (R, S) => Math.max(1, 0.4 * (S / FACTOR) * (Math.pow(R, 1 / DECAY) - 1));
      const initialStability = (G) => w[G - 1];
      const initialDifficulty = (G) => clamp(w[4] - Math.exp(w[5] * (G - 1)) + 1, 1, 10);
      const nextDifficulty = (D, G) => {
        const delta = -w[6] * (G - 3);
        const Dprime = D + delta * ((10 - D) / 9);
        return clamp(w[7] * initialDifficulty(Grade.EASY) + (1 - w[7]) * Dprime, 1, 10);
      };
      const nextStabilityAfterRecall = (d, s, r, g) => {
        const hp = g === Grade.HARD ? w[15] : 1;
        const eb = g === Grade.EASY ? w[16] : 1;
        const mult = Math.exp(w[8]) * (11 - d) * Math.pow(s, -w[9]) * (Math.exp((1 - r) * w[10]) - 1) * hp * eb;
        return clamp(s * (1 + mult), 0, MAX_S);
      };
      const nextStabilityAfterForgetting = (d, s, r) => {
        return clamp(w[11] * Math.pow(d, -w[12]) * (Math.pow(s + 1, w[13]) - 1) * Math.exp((1 - r) * w[14]), 0, MAX_S);
      };

      return {
        newCard(firstGrade) {
          const D = initialDifficulty(firstGrade);
          const S = clamp(initialStability(firstGrade), 0, MAX_S);
          const I = nextInterval(rr, S);
          return { D, S, I };
        },
        gradeCard(card, daysSinceReview, grade) {
          const D = nextDifficulty(card.D, grade);
          let S;
          if (daysSinceReview < 1) {
            S = card.S * Math.exp(w[17] * (grade - 3 + w[18]));
          } else {
            const R = retrievability(daysSinceReview, card.S);
            S = grade === Grade.AGAIN
              ? nextStabilityAfterForgetting(D, card.S, R)
              : nextStabilityAfterRecall(D, card.S, R, grade);
          }
          const I = nextInterval(rr, clamp(S, 0, MAX_S));
          return { D, S, I };
        },
      };
    }

    function formatInterval(days) {
      if (days < 1/1440) return "<1m";
      if (days < 1/24) return Math.round(days * 1440) + "m";
      if (days < 1) return Math.round(days * 24) + "h";
      if (days < 30) return Math.round(days) + "d";
      if (days < 365) return Math.round(days / 30) + "mo";
      return (days / 365).toFixed(1) + "y";
    }

    function getIntervalPreviews(card, scores) {
      const deck = createDeck();
      const key = card.catId + ":" + card.q.slice(0, 40);
      const s = scores[key];
      const previews = {};
      if (!s || !s._fsrs) {
        [Grade.AGAIN, Grade.HARD, Grade.GOOD, Grade.EASY].forEach(g => { previews[g] = formatInterval(deck.newCard(g).I); });
      } else {
        const daysSince = Math.max(0, (Date.now() - s.lastSeen) / 86400000);
        [Grade.AGAIN, Grade.HARD, Grade.GOOD, Grade.EASY].forEach(g => { previews[g] = formatInterval(deck.gradeCard({ D: s.D, S: s.S }, daysSince, g).I); });
      }
      return previews;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const STORAGE_KEY = "theory-flashcard-scores";

    function migrateScore(old) {
      const total = (old.right || 0) + (old.wrong || 0);
      if (total === 0) return null;
      const acc = old.right / total;
      const grade = acc >= 0.9 ? Grade.EASY : acc >= 0.7 ? Grade.GOOD : acc >= 0.4 ? Grade.HARD : Grade.AGAIN;
      const deck = createDeck();
      let state = deck.newCard(grade);
      const sims = Math.min(old.right || 0, 5);
      for (let i = 0; i < sims; i++) state = deck.gradeCard(state, state.I, Grade.GOOD);
      return {
        D: state.D, S: state.S, I: state.I,
        due: (old.lastSeen || Date.now()) + state.I * 86400000,
        state: 2, reps: old.right || 0, lapses: old.wrong || 0,
        right: old.right || 0, wrong: old.wrong || 0,
        lastSeen: old.lastSeen || Date.now(), _fsrs: true,
      };
    }

    function loadScores() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const scores = raw ? JSON.parse(raw) : {};
        let changed = false;
        for (const key of Object.keys(scores)) {
          if (scores[key] && !scores[key]._fsrs) {
            const migrated = migrateScore(scores[key]);
            if (migrated) { scores[key] = migrated; changed = true; }
            else { delete scores[key]; changed = true; }
          }
        }
        if (changed) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(scores)); } catch {} }
        return scores;
      } catch { return {}; }
    }

    function persistScores(s) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {}
      // Fire-and-forget sync to server
      fetch("/api/scores", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(s),
      }).catch(() => {});
    }

    async function fetchRemoteScores() {
      try {
        const res = await fetch("/api/scores");
        if (!res.ok) return null;
        const data = await res.json();
        return data && typeof data === "object" && !data.error ? data : null;
      } catch { return null; }
    }

    function mergeScores(local, remote) {
      if (!remote) return local;
      const merged = { ...local };
      for (const key of Object.keys(remote)) {
        if (!merged[key]) {
          merged[key] = remote[key];
        } else if (merged[key]._fsrs || remote[key]._fsrs) {
          // FSRS data: prefer whichever was reviewed more recently
          if ((remote[key].lastSeen || 0) > (merged[key].lastSeen || 0)) merged[key] = remote[key];
        } else {
          merged[key] = {
            right: Math.max(merged[key].right, remote[key].right),
            wrong: Math.max(merged[key].wrong, remote[key].wrong),
            lastSeen: Math.max(merged[key].lastSeen || 0, remote[key].lastSeen || 0),
          };
        }
      }
      return merged;
    }

    function TheoryFlashcards() {
      const [mode, setMode] = useState("menu");
      const [selectedCats, setSelectedCats] = useState([]);
      const [cards, setCards] = useState([]);
      const [idx, setIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [scores, setScores] = useState(loadScores);
      const [sessionResults, setSessionResults] = useState([]);

      useEffect(() => {
        fetchRemoteScores().then(remote => {
          if (remote) {
            const merged = mergeScores(loadScores(), remote);
            setScores(merged);
            persistScores(merged);
          }
        });
      }, []);

      const saveScores = (s) => {
        setScores(s);
        persistScores(s);
      };

      const startSession = (catIds) => {
        const selected = CATEGORIES.filter(c => catIds.includes(c.id));
        const allCards = selected.flatMap(c => c.cards.map(card => ({ ...card, catId: c.id, catName: c.name, catColor: c.color })));
        const now = Date.now();
        const overdue = [], learning = [], newCards = [], dueToday = [], future = [];
        for (const card of allCards) {
          const key = card.catId + ":" + card.q.slice(0, 40);
          const s = scores[key];
          if (!s || !s._fsrs) {
            newCards.push(card);
          } else if (s.state === 1 || s.state === 3) {
            learning.push({ card, due: s.due });
          } else if (s.due <= now) {
            overdue.push({ card, due: s.due });
          } else if (s.due <= now + 86400000) {
            dueToday.push({ card, due: s.due });
          } else {
            future.push({ card, due: s.due });
          }
        }
        overdue.sort((a, b) => a.due - b.due);
        learning.sort((a, b) => a.due - b.due);
        dueToday.sort((a, b) => a.due - b.due);
        future.sort((a, b) => a.due - b.due);
        const ordered = [
          ...overdue.map(x => x.card),
          ...learning.map(x => x.card),
          ...shuffle(newCards),
          ...dueToday.map(x => x.card),
          ...future.map(x => x.card),
        ];
        setCards(ordered);
        setIdx(0);
        setFlipped(false);
        setSessionResults([]);
        setMode("study");
      };

      const markCard = (grade) => {
        const card = cards[idx];
        const key = card.catId + ":" + card.q.slice(0, 40);
        const deck = createDeck();
        const newScores = { ...scores };
        const now = Date.now();
        const prev = newScores[key];
        let fsrs;
        if (!prev || !prev._fsrs) {
          fsrs = deck.newCard(grade);
          newScores[key] = {
            D: fsrs.D, S: fsrs.S, I: fsrs.I,
            due: now + fsrs.I * 86400000,
            state: grade === Grade.AGAIN ? 1 : 2,
            reps: grade >= Grade.HARD ? 1 : 0,
            lapses: grade === Grade.AGAIN ? 1 : 0,
            right: grade >= Grade.HARD ? 1 : 0,
            wrong: grade === Grade.AGAIN ? 1 : 0,
            lastSeen: now, _fsrs: true,
          };
        } else {
          const daysSince = Math.max(0, (now - prev.lastSeen) / 86400000);
          fsrs = deck.gradeCard({ D: prev.D, S: prev.S }, daysSince, grade);
          newScores[key] = {
            D: fsrs.D, S: fsrs.S, I: fsrs.I,
            due: now + fsrs.I * 86400000,
            state: grade === Grade.AGAIN ? 3 : 2,
            reps: prev.reps + (grade >= Grade.HARD ? 1 : 0),
            lapses: prev.lapses + (grade === Grade.AGAIN ? 1 : 0),
            right: prev.right + (grade >= Grade.HARD ? 1 : 0),
            wrong: prev.wrong + (grade === Grade.AGAIN ? 1 : 0),
            lastSeen: now, _fsrs: true,
          };
        }
        saveScores(newScores);
        setSessionResults([...sessionResults, { card, grade, nextInterval: fsrs.I }]);
        if (idx < cards.length - 1) {
          setIdx(idx + 1);
          setFlipped(false);
        } else {
          setMode("results");
        }
      };

      useEffect(() => {
        const handleKey = (e) => {
          if (mode !== "study") return;
          if (e.code === "Space") {
            e.preventDefault();
            if (!flipped) { setFlipped(true); } else { markCard(Grade.GOOD); }
          }
          if (flipped) {
            if (e.key === "1" || e.key === "n" || e.key === "N") markCard(Grade.AGAIN);
            if (e.key === "2") markCard(Grade.HARD);
            if (e.key === "3") markCard(Grade.GOOD);
            if (e.key === "4") markCard(Grade.EASY);
          }
        };
        window.addEventListener("keydown", handleKey);
        return () => window.removeEventListener("keydown", handleKey);
      }, [mode, flipped, cards, idx, scores, sessionResults]);

      const totalCards = CATEGORIES.reduce((s, c) => s + c.cards.length, 0);
      const totalRight = Object.values(scores).reduce((s, v) => s + v.right, 0);
      const totalAttempts = Object.values(scores).reduce((s, v) => s + v.right + v.wrong, 0);

      const getCatStats = (catId) => {
        const cat = CATEGORIES.find(c => c.id === catId);
        let right = 0, total = 0, due = 0;
        const now = Date.now();
        cat.cards.forEach(card => {
          const key = catId + ":" + card.q.slice(0, 40);
          const s = scores[key];
          if (!s || !s._fsrs) { due++; }
          else {
            right += s.right; total += s.right + s.wrong;
            if (s.due <= now) due++;
          }
        });
        return { right, total, pct: total > 0 ? Math.round((right / total) * 100) : null, due };
      };

      if (mode === "summary") {
        const now = Date.now();
        const testDate = new Date("2026-03-08T09:00:00").getTime();
        const daysLeft = Math.max(0, Math.ceil((testDate - now) / 86400000));

        const catBreakdown = CATEGORIES.map(cat => {
          let studied = 0, newCount = 0, dueNow = 0, totalRight = 0, totalWrong = 0, mature = 0, avgStability = 0, stabCount = 0;
          cat.cards.forEach(card => {
            const key = cat.id + ":" + card.q.slice(0, 40);
            const s = scores[key];
            if (!s || !s._fsrs) { newCount++; dueNow++; }
            else {
              studied++;
              totalRight += s.right; totalWrong += s.wrong;
              avgStability += s.S; stabCount++;
              if (s.S >= 21) mature++;
              if (s.due <= now) dueNow++;
            }
          });
          const acc = (totalRight + totalWrong) > 0 ? Math.round((totalRight / (totalRight + totalWrong)) * 100) : null;
          return { cat, studied, newCount, dueNow, totalRight, totalWrong, acc, mature, avgStab: stabCount > 0 ? avgStability / stabCount : 0, total: cat.cards.length };
        });

        const allStudied = catBreakdown.reduce((s, c) => s + c.studied, 0);
        const allMature = catBreakdown.reduce((s, c) => s + c.mature, 0);
        const allDue = catBreakdown.reduce((s, c) => s + c.dueNow, 0);
        const allNew = catBreakdown.reduce((s, c) => s + c.newCount, 0);
        const readiness = totalCards > 0 ? Math.round((allMature / totalCards) * 100) : 0;

        const forecast = [];
        for (let d = 0; d < Math.min(daysLeft, 21); d++) {
          const dayStart = now + d * 86400000;
          const dayEnd = dayStart + 86400000;
          let dueCount = 0;
          CATEGORIES.forEach(cat => cat.cards.forEach(card => {
            const key = cat.id + ":" + card.q.slice(0, 40);
            const s = scores[key];
            if (!s || !s._fsrs) { if (d === 0) dueCount++; }
            else if (s.due >= dayStart && s.due < dayEnd) dueCount++;
            else if (d === 0 && s.due < now) dueCount++;
          }));
          forecast.push(dueCount);
        }
        const maxForecast = Math.max(...forecast, 1);

        const weakTopics = catBreakdown.filter(c => c.acc !== null && c.acc < 75).sort((a, b) => (a.acc || 0) - (b.acc || 0));

        return (
          <div style={{ minHeight: "100vh", background: "#0a0a0f", color: "#e8e6e3" }}>
            <div style={{ maxWidth: 680, margin: "0 auto", padding: "32px 24px 60px" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 24 }}>
                <h1 style={{ fontSize: 22, fontWeight: 700, margin: 0, color: "#d0d0e0" }}>Study Summary</h1>
                <button onClick={() => setMode("menu")}
                  style={{ background: "none", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 8, color: "#8a8a9a", padding: "6px 16px", cursor: "pointer", fontSize: 13, fontFamily: "inherit" }}>
                  Back
                </button>
              </div>

              {/* Readiness + key stats */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginBottom: 24 }}>
                <div style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 12, padding: 16, textAlign: "center" }}>
                  <div style={{ fontSize: 32, fontWeight: 700, color: readiness >= 80 ? "#34d399" : readiness >= 50 ? "#fbbf24" : "#f87171" }}>{readiness}%</div>
                  <div style={{ fontSize: 11, color: "#6b6b7b", marginTop: 4, fontFamily: "'DM Mono', monospace" }}>Test Ready</div>
                </div>
                <div style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 12, padding: 16, textAlign: "center" }}>
                  <div style={{ fontSize: 32, fontWeight: 700, color: "#f97316" }}>{allDue}</div>
                  <div style={{ fontSize: 11, color: "#6b6b7b", marginTop: 4, fontFamily: "'DM Mono', monospace" }}>Due Now</div>
                </div>
                <div style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 12, padding: 16, textAlign: "center" }}>
                  <div style={{ fontSize: 32, fontWeight: 700, color: daysLeft <= 7 ? "#f87171" : "#60a5fa" }}>{daysLeft}</div>
                  <div style={{ fontSize: 11, color: "#6b6b7b", marginTop: 4, fontFamily: "'DM Mono', monospace" }}>Days Left</div>
                </div>
              </div>

              {/* Card breakdown bar */}
              <div style={{ marginBottom: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#8a8a9a", marginBottom: 8 }}>Card Status</div>
                <div style={{ display: "flex", height: 8, borderRadius: 4, overflow: "hidden", background: "rgba(255,255,255,0.06)" }}>
                  {allMature > 0 && <div style={{ width: (allMature / totalCards * 100) + "%", background: "#34d399" }} title={allMature + " mature"} />}
                  {(allStudied - allMature) > 0 && <div style={{ width: ((allStudied - allMature) / totalCards * 100) + "%", background: "#fbbf24" }} title={(allStudied - allMature) + " learning"} />}
                  {allNew > 0 && <div style={{ width: (allNew / totalCards * 100) + "%", background: "#444" }} title={allNew + " new"} />}
                </div>
                <div style={{ display: "flex", gap: 16, marginTop: 6, fontSize: 11, fontFamily: "'DM Mono', monospace", color: "#6b6b7b" }}>
                  <span><span style={{ color: "#34d399" }}>{allMature}</span> mature</span>
                  <span><span style={{ color: "#fbbf24" }}>{allStudied - allMature}</span> learning</span>
                  <span><span style={{ color: "#666" }}>{allNew}</span> new</span>
                </div>
              </div>

              {/* Review forecast */}
              <div style={{ marginBottom: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#8a8a9a", marginBottom: 8 }}>Review Forecast (next {forecast.length} days)</div>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 2, height: 60 }}>
                  {forecast.map((count, i) => (
                    <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center" }}>
                      <div style={{
                        width: "100%", minHeight: 2,
                        height: Math.max(2, (count / maxForecast) * 48),
                        background: i === 0 ? "#f97316" : "rgba(99,102,241,0.5)",
                        borderRadius: "2px 2px 0 0",
                      }} title={count + " cards"} />
                      {(i === 0 || i === forecast.length - 1 || i === 6) && (
                        <div style={{ fontSize: 9, color: "#555", marginTop: 2, fontFamily: "'DM Mono', monospace" }}>
                          {i === 0 ? "today" : "+" + i + "d"}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              {/* Weak topics */}
              {weakTopics.length > 0 && (
                <div style={{ marginBottom: 24 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#f87171", marginBottom: 8 }}>Weak Topics (below 75%)</div>
                  {weakTopics.map(c => (
                    <div key={c.cat.id} onClick={() => { setSelectedCats([c.cat.id]); startSession([c.cat.id]); }}
                      style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", margin: "4px 0", background: "rgba(239,68,68,0.05)", border: "1px solid rgba(239,68,68,0.1)", borderRadius: 8, cursor: "pointer" }}>
                      <div style={{ width: 6, height: 28, borderRadius: 3, background: c.cat.color, flexShrink: 0 }} />
                      <div style={{ flex: 1, fontSize: 13, fontWeight: 600, color: "#d0d0e0" }}>{c.cat.name}</div>
                      <span style={{ fontSize: 12, color: "#f87171", fontWeight: 700, fontFamily: "'DM Mono', monospace" }}>{c.acc}%</span>
                    </div>
                  ))}
                </div>
              )}

              {/* Per-topic breakdown */}
              <div>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#8a8a9a", marginBottom: 8 }}>All Topics</div>
                {catBreakdown.map(c => (
                  <div key={c.cat.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", margin: "4px 0", background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.04)", borderRadius: 8 }}>
                    <div style={{ width: 6, height: 28, borderRadius: 3, background: c.cat.color, flexShrink: 0 }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, color: "#d0d0e0", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.cat.name}</div>
                      <div style={{ fontSize: 11, color: "#555", fontFamily: "'DM Mono', monospace" }}>
                        {c.studied}/{c.total} studied
                        {c.dueNow > 0 && <span style={{ color: "#f97316" }}> | {c.dueNow} due</span>}
                      </div>
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0 }}>
                      {c.acc !== null ? (
                        <span style={{ fontSize: 13, fontWeight: 700, fontFamily: "'DM Mono', monospace", color: c.acc >= 80 ? "#34d399" : c.acc >= 60 ? "#fbbf24" : "#f87171" }}>{c.acc}%</span>
                      ) : (
                        <span style={{ fontSize: 11, color: "#444", fontFamily: "'DM Mono', monospace" }}>--</span>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      if (mode === "menu") {
        return (
          <div style={{ minHeight: "100vh", background: "#0a0a0f", color: "#e8e6e3" }}>
            <div style={{ background: "linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%)", borderBottom: "1px solid rgba(255,255,255,0.06)", padding: "32px 24px 28px" }}>
              <div style={{ maxWidth: 680, margin: "0 auto" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8 }}>
                  <span style={{ display: "inline-flex", width: 28, height: 28 }} dangerouslySetInnerHTML={{ __html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:#f97316"><path d="M12 2a7 7 0 0 0-7 7c0 1.5.5 2.9 1.3 4A6.96 6.96 0 0 0 5 17a5 5 0 0 0 3.5 4.8V22h7v-.2A5 5 0 0 0 19 17a6.96 6.96 0 0 0-1.3-4A6.96 6.96 0 0 0 19 9a7 7 0 0 0-7-7z"/><path d="M12 2v20M8 6c-1 1-1.5 2.5-1 4M16 6c1 1 1.5 2.5 1 4M9 14c-.5 1-.5 2 0 3M15 14c.5 1 .5 2 0 3"/></svg>' }} />
                  <h1 style={{ fontSize: 26, fontWeight: 700, margin: 0, background: "linear-gradient(90deg, #f97316, #ef4444, #ec4899)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>Theory Test Flashcards</h1>
                </div>
                <p style={{ color: "#8a8a9a", margin: "4px 0 16px", fontSize: 14, fontFamily: "'DM Mono', monospace" }}>
                  {totalCards} cards across {CATEGORIES.length} topics
                  {totalAttempts > 0 && (" | " + Math.round((totalRight / totalAttempts) * 100) + "% accuracy")}
                  {" | "}{CATEGORIES.reduce((s, c) => s + getCatStats(c.id).due, 0)} due for review
                </p>

                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button onClick={() => { setSelectedCats(CATEGORIES.map(c => c.id)); startSession(CATEGORIES.map(c => c.id)); }}
                    style={{ padding: "10px 20px", background: "linear-gradient(135deg, #ef4444, #f97316)", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, cursor: "pointer", fontSize: 14, fontFamily: "inherit" }}>
                    Study All ({totalCards} cards)
                  </button>
                  <button onClick={() => {
                    const weak = CATEGORIES.filter(c => { const s = getCatStats(c.id); return s.pct !== null && s.pct < 75; });
                    const ids = weak.length > 0 ? weak.map(c => c.id) : CATEGORIES.map(c => c.id);
                    setSelectedCats(ids); startSession(ids);
                  }} style={{ padding: "10px 20px", background: "rgba(239,68,68,0.15)", border: "1px solid rgba(239,68,68,0.3)", borderRadius: 10, color: "#f87171", fontWeight: 700, cursor: "pointer", fontSize: 14, fontFamily: "inherit" }}>
                    Weak Topics Only
                  </button>
                  <button onClick={() => setMode("summary")}
                    style={{ padding: "10px 20px", background: "rgba(99,102,241,0.15)", border: "1px solid rgba(99,102,241,0.3)", borderRadius: 10, color: "#818cf8", fontWeight: 700, cursor: "pointer", fontSize: 14, fontFamily: "inherit" }}>
                    Summary
                  </button>
                </div>
              </div>
            </div>

            <div style={{ maxWidth: 680, margin: "0 auto", padding: "16px 24px 60px" }}>
              {CATEGORIES.map(cat => {
                const stats = getCatStats(cat.id);
                return (
                  <div key={cat.id} onClick={() => { setSelectedCats([cat.id]); startSession([cat.id]); }}
                    style={{
                      margin: "8px 0", padding: "14px 16px", background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)",
                      borderRadius: 12, cursor: "pointer", display: "flex", alignItems: "center", gap: 14, transition: "all 0.15s",
                    }}>
                    <div style={{ width: 8, height: 40, borderRadius: 4, background: cat.color, flexShrink: 0 }} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 15, fontWeight: 600, color: "#d0d0e0" }}>{cat.name}</div>
                      <div style={{ fontSize: 12, color: "#6b6b7b", marginTop: 2, fontFamily: "'DM Mono', monospace" }}>
                        {cat.cards.length} cards
                        {stats.pct !== null && (" | " + stats.pct + "%")}
                        {stats.due > 0 && <span style={{ color: "#f97316" }}> | {stats.due} due</span>}
                      </div>
                    </div>
                    {stats.pct !== null && (
                      <div style={{
                        width: 44, height: 44, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                        background: stats.pct >= 80 ? "rgba(52,211,153,0.12)" : stats.pct >= 60 ? "rgba(251,191,36,0.12)" : "rgba(239,68,68,0.12)",
                        color: stats.pct >= 80 ? "#34d399" : stats.pct >= 60 ? "#fbbf24" : "#f87171",
                        fontSize: 13, fontWeight: 700, fontFamily: "'DM Mono', monospace",
                      }}>
                        {stats.pct}%
                      </div>
                    )}
                    <span style={{ color: "#444", fontSize: 18 }}>{"\u2192"}</span>
                  </div>
                );
              })}

              {totalAttempts > 0 && (
                <button onClick={() => {
                  if (confirm("Reset all flashcard progress?")) { saveScores({}); }
                }} style={{
                  display: "block", margin: "24px auto 0", padding: "8px 20px", background: "transparent",
                  border: "1px solid rgba(255,255,255,0.08)", borderRadius: 8, color: "#555", fontSize: 12,
                  cursor: "pointer", fontFamily: "'DM Mono', monospace",
                }}>Reset all scores</button>
              )}
            </div>
          </div>
        );
      }

      if (mode === "results") {
        const againCount = sessionResults.filter(r => r.grade === Grade.AGAIN).length;
        const hardCount = sessionResults.filter(r => r.grade === Grade.HARD).length;
        const goodCount = sessionResults.filter(r => r.grade === Grade.GOOD).length;
        const easyCount = sessionResults.filter(r => r.grade === Grade.EASY).length;
        const passed = hardCount + goodCount + easyCount;
        const total = sessionResults.length;
        const pct = total > 0 ? Math.round((passed / total) * 100) : 0;
        const needsWork = sessionResults.filter(r => r.grade <= Grade.HARD);

        return (
          <div style={{ minHeight: "100vh", background: "#0a0a0f", color: "#e8e6e3" }}>
            <div style={{ maxWidth: 680, margin: "0 auto", padding: "40px 24px" }}>
              <div style={{ textAlign: "center", marginBottom: 32 }}>
                <h2 style={{ fontSize: 28, fontWeight: 700, margin: "0 0 8px", color: pct >= 86 ? "#34d399" : pct >= 60 ? "#fbbf24" : "#f87171" }}>
                  {passed}/{total} — {pct}%
                </h2>
                <p style={{ color: "#8a8a9a", fontSize: 14, marginBottom: 16 }}>
                  {pct >= 86 ? "Smashing it! You're test-ready on these topics." : pct >= 60 ? "Good progress — keep drilling the ones you missed." : "Keep going — focus on the cards below."}
                </p>
                <div style={{ display: "flex", gap: 16, justifyContent: "center", fontSize: 13, fontFamily: "'DM Mono', monospace" }}>
                  {againCount > 0 && <span style={{ color: "#f87171" }}>Again: {againCount}</span>}
                  {hardCount > 0 && <span style={{ color: "#fbbf24" }}>Hard: {hardCount}</span>}
                  <span style={{ color: "#34d399" }}>Good: {goodCount}</span>
                  {easyCount > 0 && <span style={{ color: "#60a5fa" }}>Easy: {easyCount}</span>}
                </div>
              </div>

              {needsWork.length > 0 && (
                <div style={{ marginBottom: 32 }}>
                  <h3 style={{ fontSize: 14, fontWeight: 700, color: "#f87171", marginBottom: 12, fontFamily: "'DM Mono', monospace" }}>
                    NEEDS WORK ({needsWork.length})
                  </h3>
                  {needsWork.map((r, i) => (
                    <div key={i} style={{
                      margin: "8px 0", padding: "14px 16px",
                      background: r.grade === Grade.AGAIN ? "rgba(239,68,68,0.05)" : "rgba(251,191,36,0.05)",
                      border: "1px solid " + (r.grade === Grade.AGAIN ? "rgba(239,68,68,0.12)" : "rgba(251,191,36,0.12)"),
                      borderRadius: 10,
                    }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: r.grade === Grade.AGAIN ? "#e0c0c0" : "#e0d8c0" }}>
                          {r.card.q.replace(/ \[Sign .+\]$/, "")}
                        </div>
                        <span style={{ fontSize: 11, color: "#666", fontFamily: "'DM Mono', monospace", flexShrink: 0, marginLeft: 8 }}>
                          Next: {formatInterval(r.nextInterval)}
                        </span>
                      </div>
                      <div style={{ fontSize: 13, color: "#9a9aaa", lineHeight: 1.5 }}>{r.card.a}</div>
                    </div>
                  ))}
                </div>
              )}

              <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
                {needsWork.length > 0 && (
                  <button onClick={() => { setCards(shuffle(needsWork.map(r => r.card))); setIdx(0); setFlipped(false); setSessionResults([]); setMode("study"); }}
                    style={{ padding: "12px 24px", background: "rgba(239,68,68,0.15)", border: "1px solid rgba(239,68,68,0.3)", borderRadius: 10, color: "#f87171", fontWeight: 700, cursor: "pointer", fontSize: 14, fontFamily: "inherit" }}>
                    Retry Difficult ({needsWork.length})
                  </button>
                )}
                <button onClick={() => setMode("menu")}
                  style={{ padding: "12px 24px", background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, color: "#b0b0c0", fontWeight: 600, cursor: "pointer", fontSize: 14, fontFamily: "inherit" }}>
                  Back to Topics
                </button>
              </div>
            </div>
          </div>
        );
      }

      const card = cards[idx];
      const progress = ((idx + 1) / cards.length) * 100;

      return (
        <div style={{ minHeight: "100vh", background: "#0a0a0f", color: "#e8e6e3", display: "flex", flexDirection: "column" }}>
          {/* Top bar */}
          <div style={{ padding: "16px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
            <button onClick={() => setMode("menu")} style={{ background: "none", border: "none", color: "#6b6b7b", cursor: "pointer", fontSize: 14, fontFamily: "inherit" }}>
              {"\u2190"} Save & Exit
            </button>
            <span style={{ fontSize: 13, color: "#6b6b7b", fontFamily: "'DM Mono', monospace" }}>
              {idx + 1} / {cards.length}
            </span>
            <button onClick={() => { if (sessionResults.length > 0) setMode("results"); else setMode("menu"); }}
              style={{ background: "none", border: "none", color: "#6b6b7b", cursor: "pointer", fontSize: 13, fontFamily: "'DM Mono', monospace" }}>
              Results
            </button>
          </div>

          {/* Progress bar */}
          <div style={{ height: 3, background: "rgba(255,255,255,0.06)" }}>
            <div style={{ height: "100%", width: progress + "%", background: card.catColor, transition: "width 0.3s" }} />
          </div>

          {/* Card */}
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "24px" }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: card.catColor, fontFamily: "'DM Mono', monospace", marginBottom: 16 }}>
              {card.catName.toUpperCase()}
            </span>

            <div onClick={() => setFlipped(!flipped)} style={{
              width: "100%", maxWidth: 560, minHeight: 280, padding: "32px 28px",
              background: flipped ? card.catColor + "0a" : "rgba(255,255,255,0.04)",
              border: "1px solid " + (flipped ? card.catColor + "25" : "rgba(255,255,255,0.08)"),
              borderRadius: 16, cursor: "pointer", transition: "all 0.2s",
              display: "flex", flexDirection: "column", justifyContent: "center",
            }}>
              {!flipped ? (
                <React.Fragment>
                  {card.img && (
                    <div style={{ textAlign: "center", marginBottom: 16 }}>
                      <img src={card.img} alt="Road sign" style={{ maxHeight: 140, maxWidth: 140, filter: "drop-shadow(0 2px 8px rgba(255,255,255,0.1))" }} />
                    </div>
                  )}
                  <div style={{ fontSize: card.img ? 17 : 20, fontWeight: 600, lineHeight: 1.5, color: "#e0e0ef", marginBottom: 16, textAlign: card.img ? "center" : "left" }}>
                    {card.q.replace(/ \[Sign .+\]$/, "")}
                  </div>
                  <div style={{ fontSize: 13, color: "#555", fontFamily: "'DM Mono', monospace", textAlign: card.img ? "center" : "left" }}>
                    tap to reveal answer
                  </div>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  {card.img && (
                    <div style={{ textAlign: "center", marginBottom: 12 }}>
                      <img src={card.img} alt="Road sign" style={{ maxHeight: 80, maxWidth: 80, opacity: 0.7 }} />
                    </div>
                  )}
                  <div style={{ fontSize: 13, color: "#666", marginBottom: 8, fontFamily: "'DM Mono', monospace" }}>ANSWER</div>
                  <div style={{ fontSize: 17, lineHeight: 1.6, color: "#c0d0c0" }}>
                    {card.a}
                  </div>
                </React.Fragment>
              )}
            </div>

            {/* Rating Buttons */}
            {flipped && (() => {
              const previews = getIntervalPreviews(card, scores);
              const btns = [
                { g: Grade.AGAIN, label: "Again", sub: previews[Grade.AGAIN], bg: "rgba(239,68,68,0.12)", border: "rgba(239,68,68,0.25)", color: "#f87171" },
                { g: Grade.HARD, label: "Hard", sub: previews[Grade.HARD], bg: "rgba(251,191,36,0.12)", border: "rgba(251,191,36,0.25)", color: "#fbbf24" },
                { g: Grade.GOOD, label: "Good", sub: previews[Grade.GOOD], bg: "rgba(52,211,153,0.12)", border: "rgba(52,211,153,0.25)", color: "#34d399" },
                { g: Grade.EASY, label: "Easy", sub: previews[Grade.EASY], bg: "rgba(96,165,250,0.12)", border: "rgba(96,165,250,0.25)", color: "#60a5fa" },
              ];
              return (
                <React.Fragment>
                  <div style={{ display: "flex", gap: 8, marginTop: 24, flexWrap: "wrap", justifyContent: "center", maxWidth: 560, width: "100%" }}>
                    {btns.map(b => (
                      <button key={b.g} onClick={() => markCard(b.g)} style={{
                        flex: "1 1 calc(25% - 6px)", minWidth: 72, padding: "12px 8px",
                        background: b.bg, border: "1px solid " + b.border, borderRadius: 10,
                        color: b.color, cursor: "pointer", fontFamily: "inherit",
                        display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
                      }}>
                        <span style={{ fontWeight: 700, fontSize: 14 }}>{b.label}</span>
                        <span style={{ fontSize: 11, opacity: 0.7, fontFamily: "'DM Mono', monospace" }}>{b.sub}</span>
                      </button>
                    ))}
                  </div>
                  <div style={{ marginTop: 12, fontSize: 11, color: "#444", fontFamily: "'DM Mono', monospace" }}>
                    1=Again  2=Hard  Space/3=Good  4=Easy
                  </div>
                </React.Fragment>
              );
            })()}

            {!flipped && (
              <div style={{ marginTop: 20, fontSize: 12, color: "#444" }}>
                Tap the card or press Space to flip
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<TheoryFlashcards />);
  </script>
</body>
</html>
